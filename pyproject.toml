[project]
name = "songkey"
version = "0.0.1"
description = "Press Ctrl+Alt+S to name the song playing through your Windows speakers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Somneel Saha" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "PyAudioWPatch>=0.2.12.8,<0.3",
  "shazamio>=0.8.1,<0.9",
]

[project.urls]
Repository = "https://github.com/SomneelSaha2042/songkey"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-qt>=4.4,<5",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "pyinstaller>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "hardware: requires real Windows audio/hotkey hardware",
  "live: hits the live ShazamIO network service",
]

[[tool.mypy.overrides]]
module = ["pyaudiowpatch", "shazamio"]
ignore_missing_imports = true

